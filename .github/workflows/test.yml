name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
      - run: go vet ./...
      - run: go test -race -timeout 5m ./...

  # Runs the built binary end to end on every OS we release for.
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python
            exe: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
      - run: go build -o agentkeeper-mcp-gateway${{ matrix.exe }} .
      - run: ${{ matrix.python }} scripts/smoke/smoke.py ./agentkeeper-mcp-gateway${{ matrix.exe }}

  # Informational: the unit tests have not been run on Windows before, so this
  # job reports without blocking merges.
  windows-unit:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
      - run: go vet ./...
      # Still run the tests when vet fails, so both results are visible.
      - if: ${{ !cancelled() }}
        run: go test -timeout 15m ./...
