version: 2
builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -buildid=
      - -X github.com/rad-security/agentkeeper-mcp-gateway/cmd.version={{.Version}}
      - -X github.com/rad-security/agentkeeper-mcp-gateway/cmd.commit={{.Commit}}
      - -X github.com/rad-security/agentkeeper-mcp-gateway/cmd.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# Generate an SPDX JSON SBOM for every platform archive. GoReleaser adds the
# documents to checksums.txt, so the existing keyless checksum signature also
# binds the SBOMs to this release.
sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"

# Preserve SemVer prerelease tags (for example, v0.2.0-sandbox.2) as GitHub
# prereleases when GoReleaser publishes assets to an existing release. Stable
# tags continue to publish as ordinary releases.
release:
  prerelease: auto

# Homebrew tap is out of scope for v0.1.0 — tap repo does not exist.
# Re-enable once rad-security/homebrew-tap is created (see parent plan §4 Non-Goals).
